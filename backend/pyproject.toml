[project]
name = "pssst-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.12,<1",
  "httpx>=0.27,<1",
  "faster-whisper>=1.1,<2",
  "alembic>=1.13,<2"
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.7", "aiosqlite>=0.20,<1"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint]
# The codebase uses a deliberately compact one-line style; lint focuses on
# real problems (unused names, import order, bugbear) rather than formatting.
select = ["F", "I", "B", "BLE", "UP"]
# FastAPI endpoints intentionally use Depends() in argument defaults.
ignore = ["B008"]
