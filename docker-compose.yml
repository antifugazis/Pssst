services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pssst
      POSTGRES_USER: pssst
      POSTGRES_PASSWORD: pssst_dev
    ports:
      - "5433:5432"
    volumes:
      - pssst-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pssst -d pssst"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pssst-postgres:
